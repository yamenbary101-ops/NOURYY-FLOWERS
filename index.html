<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050509"><title>For Nouryy ♡</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050509;color:#ffd4e5}body{font-family:Georgia,serif;overflow:hidden}.scene{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at 50% 53%,#180a1b 0%,#08060c 50%,#030305 100%)}h1{font-size:clamp(31px,7vw,66px);font-style:italic;font-weight:400;letter-spacing:.015em;text-align:center;margin:0 12px 3px;text-shadow:0 0 22px #fa77a16e;z-index:2;animation:fade 2s both}.heart{font-size:19px;color:#f76c9d;text-align:center;animation:pulse 2.2s infinite;z-index:2}canvas{display:block;width:min(100vw,660px);height:min(75dvh,720px);max-height:720px;object-fit:contain;z-index:1}.hint{position:absolute;bottom:19px;color:#b78a9b;font:12px monospace;letter-spacing:.15em;opacity:.75;z-index:2}.star{position:absolute;width:2px;height:2px;background:#ffe1e9;border-radius:50%;box-shadow:0 0 6px #fff;animation:twinkle 2s infinite alternate;pointer-events:none}@keyframes twinkle{to{opacity:.1;transform:scale(.5)}}@keyframes pulse{50%{transform:scale(1.18)}}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}</style></head><body><main class="scene" id="scene"><h1>I love you nouryy</h1><div class="heart">♥</div><canvas id="bouquet" width="640" height="700" aria-label="Animated ASCII art bouquet of colorful tulips"></canvas><div class="hint">made with love ♡</div></main><script>
const scene=document.getElementById('scene');for(let i=0;i<72;i++){let s=document.createElement('i');s.className='star';s.style.left=((i*61.73)%100)+'%';s.style.top=((i*37.17)%100)+'%';s.style.animationDelay=-(i*.23)+'s';s.style.opacity=.15+(i%5)*.11;scene.appendChild(s)}
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');const W=640,H=700;const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d');let start=performance.now();const flowers=[
{x:317,y:135,r:55,c:'#f64a74',lean:0},{x:216,y:186,r:52,c:'#f3a4cd',lean:-.2},{x:419,y:184,r:53,c:'#f6d6a7',lean:.15},{x:133,y:271,r:48,c:'#a96adf',lean:-.34},{x:504,y:270,r:49,c:'#f0446b',lean:.25},{x:245,y:295,r:56,c:'#f9a0a6',lean:-.14},{x:386,y:305,r:57,c:'#f5d8e8',lean:.18},{x:319,y:370,r:55,c:'#e95a8b',lean:0},{x:76,y:371,r:42,c:'#eac65b',lean:-.3},{x:555,y:372,r:42,c:'#eeac4c',lean:.3},{x:190,y:405,r:48,c:'#eecc6b',lean:-.2},{x:460,y:418,r:47,c:'#b84173',lean:.25}];
function stem(f){o.strokeStyle='#5caa5a';o.lineWidth=7;o.beginPath();o.moveTo(318,645);o.bezierCurveTo(318,525,f.x,f.y+95,f.x,f.y+22);o.stroke();o.strokeStyle='#a4d67c';o.lineWidth=2;o.stroke()}
function leaf(x,y,ang,scale){o.save();o.translate(x,y);o.rotate(ang);o.scale(scale,scale);o.fillStyle='#4b9c50';o.beginPath();o.moveTo(0,0);o.quadraticCurveTo(-42,-58,2,-144);o.quadraticCurveTo(43,-71,0,0);o.fill();o.strokeStyle='#9cd578';o.lineWidth=2;o.beginPath();o.moveTo(0,0);o.lineTo(2,-124);o.stroke();o.restore()}
function tulip(f){o.save();o.translate(f.x,f.y);o.rotate(f.lean);const r=f.r;o.fillStyle=f.c;o.beginPath();o.moveTo(-r*.8,-r*.18);o.quadraticCurveTo(-r*1.06,r*.42,-r*.45,r*.84);o.quadraticCurveTo(0,r*1.18,r*.47,r*.83);o.quadraticCurveTo(r*1.04,r*.4,r*.8,-r*.18);o.lineTo(r*.57,-r*.65);o.lineTo(r*.26,-r*.31);o.lineTo(0,-r*.91);o.lineTo(-r*.27,-r*.32);o.lineTo(-r*.59,-r*.7);o.closePath();o.fill();o.fillStyle='#00000025';o.beginPath();o.moveTo(0,-r*.82);o.quadraticCurveTo(-r*.4,-r*.08,0,r*.85);o.quadraticCurveTo(r*.39,-r*.09,0,-r*.82);o.fill();o.strokeStyle='#ffffff65';o.lineWidth=2;o.beginPath();o.moveTo(-r*.54,-r*.59);o.quadraticCurveTo(-r*.45,r*.15,-r*.13,r*.63);o.moveTo(r*.56,-r*.55);o.quadraticCurveTo(r*.46,r*.12,r*.14,r*.63);o.stroke();o.restore()}
function render(t){o.clearRect(0,0,W,H);flowers.forEach(stem);for(let i=0;i<20;i++){let x=135+(i*73)%370,y=495+(i*41)%125;leaf(x,y,(i%2?1:-1)*(.5+(i%4)*.19),.65+(i%3)*.13)}flowers.forEach(tulip);let pix=o.getImageData(0,0,W,H).data;ctx.clearRect(0,0,W,H);let elapsed=(t-start)/1000;let reveal=Math.min(1,elapsed/4.5);let sway=Math.sin(t/1450)*1.7;ctx.save();ctx.translate(sway,0);ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.textBaseline='middle';let chars='01*+.:;<>/{}';for(let y=4;y<H;y+=8){for(let x=4;x<W;x+=7){let idx=(y*W+x)*4;if(pix[idx+3]<90)continue;let progress=(H-y)/H;let threshold=progress*.9+(x%29)/700;if(reveal<threshold)continue;let k=((x*13+y*7)/7|0)%chars.length;let r=pix[idx],g=pix[idx+1],b=pix[idx+2];ctx.fillStyle=`rgba(${r},${g},${b},${.65+.25*Math.sin(t/1200+x*.05)**2})`;ctx.fillText(chars[k],x,y)}}ctx.restore();requestAnimationFrame(render)}requestAnimationFrame(render);
</script></body></html>
